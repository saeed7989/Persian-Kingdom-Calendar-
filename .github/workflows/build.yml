name: Build Persian Kingdom Calendar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Apply Kingdom Theme and Pure Persian Strings
        run: |
          find . -name "colors.xml" -exec sed -i 's/#00BCD4/#2979FF/gI' {} + || true
          find . -name "colors.xml" -exec sed -i 's/#0097A7/#060B14/gI' {} + || true
          find . -name "colors.xml" -exec sed -i 's/#00695C/#0F223D/gI' {} + || true
          python3 -c '
          import glob
          replacements = [
              ("\u062a\u0642\u0648\u06cc\u0645 \u0641\u0627\u0631\u0633\u06cc", "\u06af\u0627\u06ef\u0634\u0645\u0627\u0631 \u0634\u0627\u0647\u0646\u0634\u0627\u0647\u06cc"),
              ("\u062a\u0642\u0648\u06cc\u0645", "\u06af\u0627\u06ef\u0634\u0645\u0627\u0631"),
              ("\u0647\u062c\u0631\u06cc \u0634\u0645\u0633\u06cc", "\u0634\u0627\u0647\u0646\u0634\u0627\u0647\u06cc"),
              ("\u0634\u0645\u0633\u06cc", "\u0634\u0627\u0647\u0646\u0634\u0627\u0647\u06cc"),
              ("\u0631\u0648\u06cc\u062f\u0627\u062f\u0647\u0627", "\u0631\u062e\u062f\u0627\u062f\u0647\u0627"),
              ("\u0645\u0646\u0627\u0633\u0628\u062a\u200c\u0647\u0627", "\u06cc\u0627\u062f\u0645\u0627\u0646\u200c\u0647\u0627"),
              ("\u062a\u0646\u0638\u06cc\u0645\u0627\u062a", "\u067e\u06cc\u06a9\u0631\u0628\u0646\u062f\u06cc")
          ]
          for path in glob.glob("**/strings.xml", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              for old_str, new_str in replacements:
                  content = content.replace(old_str, new_str)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Persian-Kingdom-Calendar-APK
          path: PersianCalendar/build/outputs/apk/**/*.apk
